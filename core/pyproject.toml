[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="genai-normalizer-core"
version="0.1.0"
description="Provider-aware normalization primitives for GenAI SDK requests and responses."
requires-python=">=3.9"
dependencies=[]
[project.optional-dependencies]
dev=["pytest>=7.4","mypy>=1.8","ruff>=0.4"]
[tool.setuptools.packages.find]
where=["."]
include=["genai_normalizer*"]
[tool.pytest.ini_options]
testpaths=["tests"]
